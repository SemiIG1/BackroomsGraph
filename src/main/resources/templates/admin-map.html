<!DOCTYPE html>
<html lang="en">
<head>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
        #mynetwork {
            width: 600px;
            height: 540px;
            border: 1px solid lightgray;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refresh Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="d-flex flex-column justify-content-center">
            <form action="/admin/refresh-data" method="post">
                <button type="submit"
                        class="btn btn-primary mb-3"
                        th:disabled="${isScraperRunning}"
                        th:text="${isScraperRunning ? 'Scraping in Progress...' : 'Refresh Graph Data'}">
                    Refresh Graph Data
                </button>
            </form>
            <h6 class="mb-2">Survival Difficulty</h6>
            <div class="d-flex align-items-center mb-1">
                <span class="rounded-circle me-2" style="width: 15px; height: 15px; background-color: #F7E375; border: 1px solid #c3e6cb;"></span>
                <small>Class 0 </small>
            </div>
            <div class="d-flex align-items-center mb-1">
                <span class="rounded-circle me-2" style="width: 15px; height: 15px; background-color: #FFC90E; border: 1px solid #f5c6cb;"></span>
                <small>Class 1 </small>
            </div>
            <div class="d-flex align-items-center mb-1">
                <span class="rounded-circle me-2" style="width: 15px; height: 15px; background-color: #F59C00; border: 1px solid #f5c6cb;"></span>
                <small>Class 2 </small>
            </div>
            <div class="d-flex align-items-center mb-1">
                <span class="rounded-circle me-2" style="width: 15px; height: 15px; background-color: #F95A00;"></span>
                <small>Class 3 </small>
            </div>
            <div class="d-flex align-items-center mb-1">
                <span class="rounded-circle me-2" style="width: 15px; height: 15px; background-color: #FE1701;"></span>
                <small>Class 4 </small>
            </div>
            <div class="d-flex align-items-center mb-1">
                <span class="rounded-circle me-2" style="width: 15px; height: 15px; background-color: #AF0606;"></span>
                <small>Class 5 </small>
            </div>
            <div class="d-flex align-items-center mb-1">
                <span class="rounded-circle me-2" style="width: 15px; height: 15px; background-color: #262626;"></span>
                <small>Class Unknown </small>
            </div>
        </div>

        <div id="mynetwork"></div>
    </div>


    <script type="text/javascript">
        async function getDataAndDisplayAll() {
            const url = "/api/graph";
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Response status: ${response.status}`);
                }
                const result = await response.json();
                console.log(result);
                var nodes = new vis.DataSet(result.nodes);
                var edges = new vis.DataSet(result.edges);
                var container = document.getElementById("mynetwork");
                var data = {
                    nodes: nodes,
                    edges: edges
                };
                var options = {
                    nodes: {
                        font: {
                            strokeWidth: 3
                        },
                        shape: "dot"
                    },
                    edges: {
                        arrows: {
                            to: {
                                enabled: true,
                                scaleFactor: 0.2
                            }
                        }
                    },
                    physics: {
                        solver: 'forceAtlas2Based',
                        forceAtlas2Based: {
                            gravitationalConstant: -100,
                            springLength: 100,
                            springConstant: 0.08,
                            avoidOverlap: 1.0
                        }
                    }
                };
                var network = new vis.Network(container, data, options);
            } catch (error) {
                console.error(error.message);
            }
        }
        getDataAndDisplayAll();

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
