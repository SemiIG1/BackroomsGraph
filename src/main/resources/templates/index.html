<!DOCTYPE html>
<html lang="en">
<head>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Backrooms Topology</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<!-- Navbar (Height ~56px) -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Backrooms Topology Map</span>
        <a href="https://github.com/SemiIG1/BackroomsGraph" class="text-white">View Source Code</a>
    </div>
</nav>

<div class="container-fluid p-0 d-flex flex-column">

    <div class="d-flex flex-wrap justify-content-center align-items-center p-2 bg-white border-bottom shadow-sm">
        <b class="me-3">Survival Difficulty:</b>
        <div class="d-flex align-items-center me-3">
            <span class="rounded-circle me-1" style="width: 15px; height: 15px; background-color: #F7E375; border: 1px solid #ccc;"></span>
            <small>Class 0</small>
        </div>
        <div class="d-flex align-items-center me-3">
            <span class="rounded-circle me-1" style="width: 15px; height: 15px; background-color: #FFC90E; border: 1px solid #ccc;"></span>
            <small>Class 1</small>
        </div>
        <div class="d-flex align-items-center me-3">
            <span class="rounded-circle me-1" style="width: 15px; height: 15px; background-color: #F59C00; border: 1px solid #ccc;"></span>
            <small>Class 2</small>
        </div>
        <div class="d-flex align-items-center me-3">
            <span class="rounded-circle me-1" style="width: 15px; height: 15px; background-color: #F95A00; border: 1px solid #ccc;"></span>
            <small>Class 3</small>
        </div>
        <div class="d-flex align-items-center me-3">
            <span class="rounded-circle me-1" style="width: 15px; height: 15px; background-color: #FE1701; border: 1px solid #ccc;"></span>
            <small>Class 4</small>
        </div>
        <div class="d-flex align-items-center me-0">
            <span class="rounded-circle me-1" style="width: 15px; height: 15px; background-color: #AF0606; border: 1px solid #ccc;"></span>
            <small>Class 5</small>
        </div>
    </div>

    <div class="overflow-hidden bg-white" style="height: calc(100vh - 56px);" id="mynetwork"></div>

    <div class="bg-white border-top shadow-sm p-3">
        <div id="routeError" class="alert alert-danger d-none py-2" role="alert"></div>
        <div class="row align-items-end justify-content-center">
            <div class="col-md-2 mb-3 mb-md-0">
                <label for="mode" class="form-label fw-bold">Mode</label>
                <select class="form-select" id="mode">
                    <option value="Closest">Closest</option>
                    <option value="Safest">Safest</option>
                </select>
            </div>
            <div class="col-md-3 mb-3 mb-md-0">
                <label for="startLevel" class="form-label fw-bold">Origin </label>
                <select class="form-select" id="startLevel">
                    <option value="" selected disabled>Select Start...</option>
                </select>
            </div>
            <div class="col-md-3 mb-3 mb-md-0">
                <label for="destLevel" class="form-label fw-bold">Destination </label>
                <select class="form-select" id="destLevel">
                    <option value="" selected disabled>Select Destination...</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100 fw-bold" onclick="calculateRoute()">Find Route</button>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    let globalNodes;
    let globalEdges;
    let network;
    async function getDataAndDisplayAll() {
        const url = "http://localhost:8080/api/graph";
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Response status: ${response.status}`);
            }
            const result = await response.json();
            // Store original colors so we can restore them when highlighting routes
            const nodesWithMemory = result.nodes.map(n => {
                n.originalColor = n.color;
                return n;
            });
            globalNodes = new vis.DataSet(nodesWithMemory);
            globalEdges = new vis.DataSet(result.edges);
            var container = document.getElementById("mynetwork");
            var data = {
                nodes: globalNodes,
                edges: globalEdges
            };
            var options = {
                nodes: {
                    font: { strokeWidth: 3 },
                    shape: "dot"
                },
                edges: {
                    arrows: {
                        to: { enabled: true, scaleFactor: 0.2 }
                    }
                },
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -100,
                        springLength: 100,
                        springConstant: 0.08,
                        avoidOverlap: 1.0
                    }
                }
            };
            network = new vis.Network(container, data, options);
            const startSelect = document.getElementById("startLevel");
            const destSelect = document.getElementById("destLevel");

            const sortedNodes = result.nodes.sort((a, b) => {
                const labelA = a.label || "Unnamed Level";
                const labelB = b.label || "Unnamed Level";
                return labelA.localeCompare(labelB, undefined, {numeric: true})
            });
            sortedNodes.forEach(node => {
                let opt1 = document.createElement('option');
                opt1.value = node.id;
                opt1.textContent = node.label || `Node ID: ${node.id}`;
                startSelect.appendChild(opt1);

                let opt2 = document.createElement('option');
                opt2.value = node.id;
                opt2.textContent = node.label || `Node ID: ${node.id}`;
                destSelect.appendChild(opt2);
            });
        } catch (error) {
            console.error("Failed to load graph data:", error.message);
            document.getElementById('mynetwork').innerHTML = '<div class="d-flex justify-content-center align-items-center h-100 text-muted">Backend is offline or unreachable. Please start the Spring Boot server.</div>';
        }
    }
    function showError(message) {
        const errorBox = document.getElementById('routeError');
        errorBox.textContent = message;
        errorBox.classList.remove('d-none');
    }

    function hideError() {
        document.getElementById('routeError').classList.add('d-none');
    }

    function calculateRoute() {
        hideError();
        const start = document.getElementById('startLevel').value;
        const dest = document.getElementById('destLevel').value;

        if (!start || !dest) {
            showError("Please select both a Start and Destination node.");
            return;
        }
        if (start === dest) {
            showError("Start and Destination cannot be the same level.");
            return;
        }

        fetch(`/api/route?start=${start}&end=${dest}`)
            .then(response => {
                if (!response.ok) throw new Error("Backend route API threw an error.");
                return response.json();
            })
            .then(path => {
                if (path.length === 0) {
                    showError("No valid route exists between these levels.");
                    return;
                }

                const updateNodes = globalNodes.get().map(n => {
                    const isPathNode = path.includes(n.id) || path.includes(String(n.id));

                    if (isPathNode) {
                        return { id: n.id, color: n.originalColor || null, font: { color: '#000', size: 16 } };
                    } else {
                        return {
                            id: n.id,
                            color: { background: '#dbeafe', border: '#93c5fd' },
                            font: { color: '#94a3b8', size: 14 }
                        };
                    }
                });
                globalNodes.update(updateNodes);

                const updateEdges = globalEdges.get().map(e => {
                    let isPathEdge = false;
                    for (let i = 0; i < path.length - 1; i++) {
                        if (e.from == path[i] && e.to == path[i + 1]) {
                            isPathEdge = true;
                            break;
                        }
                    }
                    if (isPathEdge) {
                        return { id: e.id, color: { color: '#ef4444' }, width: 3 }; // Red route line
                    } else {
                        return { id: e.id, color: { color: '#e2e8f0' }, width: 1 }; // Faded grey/blue line
                    }
                });
                globalEdges.update(updateEdges);

                // Camera focus
                network.fit({ nodes: path, animation: true });
            })
            .catch(error => {
                console.error("Routing error:", error);
                showError("Backend API is offline or unreachable.");
            });
    }

    getDataAndDisplayAll();

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
